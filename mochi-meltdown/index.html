<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Mochi Meltdown</title>
    <meta name="description" content="A daily slide puzzle. Get every mochi into the soup, keep Gary out.">
    <meta property="og:title" content="Mochi Meltdown">
    <meta property="og:description" content="A daily slide puzzle. Get every mochi into the soup, keep Gary out.">
    <meta property="og:image" content="https://xphoez.github.io/assets/og-mochi.png">
    <link rel="icon" href="../assets/splash-momo.png">
    <link rel="preload" href="fonts/caveat-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/patrick-hand.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="modulepreload" href="game.js">
    <style>
  @font-face{font-family:"Caveat"; src:url(fonts/caveat-700.woff2) format("woff2"); font-weight:600 700; font-display:swap}
  @font-face{font-family:"Patrick Hand"; src:url(fonts/patrick-hand.woff2) format("woff2"); font-weight:400; font-display:swap}

  :root{
    --paper:#FBF8F0; --rule:#BFD4EC; --margin:#F3A7A7; --ink:#2B2B2B; --ink-soft:#6B6660;
    --pink:#F8BBD0; --yellow:#FFF59D; --hl:#FFF176; --green:#C8E6C9; --red:#FFCDD2; --blue:#BBDEFB; --pen:#1565C0; --redpen:#D32F2F;
    --title:"Caveat","Segoe Print","Comic Sans MS",cursive;
    --hand:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive;
    --wob:255px 15px 225px 15px / 15px 225px 15px 255px;
    --wob2:15px 225px 15px 255px / 255px 15px 225px 15px;
    color-scheme: light;
  }
  html,body{height:100%}
  body{
    margin:0; color:var(--ink); font-family:var(--hand); font-size:17px; overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    background-color:var(--paper);
    background-image:linear-gradient(90deg, transparent 8px, var(--margin) 8px, var(--margin) 10px, transparent 10px), repeating-linear-gradient(var(--paper) 0 27px, var(--rule) 27px 28px);
  }
  body.evil{
    --ink:#F4F1E8; --ink-soft:#B9C4B8; --paper:#2F4A3A; --hl:rgba(255,224,130,.45); --redpen:#FF8A80;
    color:var(--ink);
    background-color:#2F4A3A;
    background-image:radial-gradient(120% 80% at 30% 20%, rgba(255,255,255,.07), transparent 60%), radial-gradient(90% 60% at 80% 90%, rgba(0,0,0,.25), transparent 70%);
  }
  .app{height:100%; box-sizing:border-box; max-width:460px; margin:0 auto; padding-inline:16px; padding-block:10px 12px; display:flex; flex-direction:column; gap:8px}
  .top{display:flex; align-items:center; gap:10px}
  .brand{line-height:1}
  .brand b{display:block; font:700 32px/0.95 var(--title)}
  .brand small{font:15px var(--hand); color:var(--ink-soft)}
  .spacer{flex:1}
  .doodle-btn{appearance:none; cursor:pointer; width:40px; height:40px; border:2px solid var(--ink); border-radius:50% 45% 55% 50% / 50% 55% 45% 50%; background:transparent; color:var(--ink); display:grid; place-items:center; padding:0; font:22px var(--hand)}
  .doodle-btn svg{width:22px; height:22px}
  .stages{display:grid; grid-template-columns:1fr 1fr auto; gap:8px}
  .stage{appearance:none; cursor:pointer; border:2px solid var(--ink); border-radius:var(--wob); background:transparent; color:var(--ink); padding:4px 10px 5px; display:flex; align-items:center; gap:8px; font:18px/1.05 var(--hand); text-align:left; opacity:.55}
  .stage:nth-child(2){border-radius:var(--wob2)}
  .stage canvas{width:30px; height:30px; flex:none}
  .stage small{display:block; font-size:13px; color:var(--ink-soft)}
  .stage em{font-style:normal; background:linear-gradient(transparent 55%, var(--hl) 55%, var(--hl) 92%, transparent 92%)}
  .stage.on{opacity:1; border-width:2.5px}
  .stage:disabled{cursor:default; opacity:.35}
  .stage .ok{margin-left:auto; font:700 24px var(--title); color:var(--redpen); font-style:normal}
  .stage.extra{flex-direction:column; justify-content:center; gap:0; padding:3px 8px 4px; text-align:center; border-radius:var(--wob2)}
  .stage.extra canvas{width:24px; height:24px}
  .stage.extra small{font-size:13px}
  .pack{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
  .pack .cell{appearance:none; cursor:pointer; aspect-ratio:1; border:2px solid #2B2B2B; border-radius:var(--wob); background:#fff; color:#2B2B2B; display:flex; flex-direction:column; align-items:center; justify-content:center; font:20px/1 var(--hand); padding:0}
  .pack .cell:nth-child(2n){border-radius:var(--wob2)}
  .pack .cell b{font:700 26px/1 var(--title)}
  .pack .cell small{font-size:13px; opacity:.7; min-height:13px}
  .pack .cell.done{background:var(--yellow)}
  .pack .cell:disabled{cursor:default; opacity:.4; border-style:dashed}
  .past{display:flex; flex-direction:column; max-height:190px; overflow:auto; border-top:1.5px dashed #BDB7AC}
  .past .row{appearance:none; cursor:pointer; background:none; border:0; border-bottom:1.5px dashed #BDB7AC; display:flex; align-items:baseline; gap:10px; padding:7px 4px; font:20px var(--hand); color:#2B2B2B; text-align:left}
  .past .row small{font-size:15px; opacity:.65}
  .past .row i{margin-left:auto; font-style:normal; font:700 22px var(--title); color:var(--redpen)}
  .pack .cell:focus-visible,.past .row:focus-visible{outline:3px dashed var(--pen); outline-offset:2px}
  .rulebar{display:flex; align-items:center; gap:8px; border:2px dashed var(--ink-soft); border-radius:10px; padding:4px 10px; font:16px/1.2 var(--hand)}
  .rulebar canvas{width:30px; height:30px; flex:none}
  .rulebar b{font:700 20px var(--title)}
  .hud{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px}
  .side{display:flex; flex-direction:column; font:15px/1 var(--hand); color:var(--ink-soft)}
  .side.right{align-items:flex-end}
  .side b{font:700 30px/1 var(--title); color:var(--ink)}
  .count{display:flex; flex-direction:column; align-items:center; gap:3px}
  .count > div:first-child{display:flex; align-items:baseline; gap:6px}
  .count b{font:700 44px/0.85 var(--title)}
  .count span{font:18px var(--hand); color:var(--ink-soft)}
  .count.low b{color:var(--redpen); animation:jitter .35s steps(2) infinite}
  @keyframes jitter{50%{transform:rotate(-4deg) scale(1.08)}}
  .ticks{display:flex; gap:4px; height:18px; align-items:center}
  .ticks i{position:relative; width:3px; height:16px; border-radius:2px; background:var(--ink); transform:rotate(4deg)}
  .ticks i:nth-child(2n){transform:rotate(-3deg); height:15px}
  .ticks i.used{opacity:.25}
  .ticks i.spare{background:var(--redpen)}
  .ticks i:not(.spare) + i.spare{margin-left:6px}
  .ticks i.used::after{content:""; position:absolute; left:-4px; top:7px; width:11px; height:2px; background:var(--redpen); transform:rotate(-30deg); opacity:1}
  .board-wrap{flex:0 0 auto; display:flex; justify-content:center; touch-action:none; margin-top:6px}
  .tray{position:relative; padding:6px; background:#FFFEF9; border:1.5px solid rgba(43,43,43,.35); border-radius:3px; box-shadow:3px 4px 0 rgba(0,0,0,.07); transform:rotate(-.4deg)}
  .tray::before,.tray::after{content:""; position:absolute; width:62px; height:18px; background:rgba(255,235,150,.7); z-index:2; pointer-events:none}
  .tray::before{top:-7px; left:14%; transform:rotate(-6deg)}
  .tray::after{bottom:-6px; right:12%; transform:rotate(4deg)}
  body.evil .tray{padding:4px; background:#2B4435; border:5px solid #8B5E3C; border-radius:6px; transform:none; box-shadow:0 6px 16px rgba(0,0,0,.4), inset 0 0 20px rgba(0,0,0,.3)}
  body.evil .tray::before,body.evil .tray::after{display:none}
  #board{display:block; touch-action:none}
  .tray.shake{animation:shake .35s linear}
  @keyframes shake{20%{transform:translate(-5px,2px) rotate(-.5deg)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,-1px) rotate(.5deg)}80%{transform:translate(2px,1px)}}
  .pop{position:absolute; left:50%; top:40%; transform:translate(-50%,-50%) rotate(-5deg); pointer-events:none; text-align:center; white-space:nowrap; opacity:0; z-index:3;
    font:700 46px/1 var(--title); color:var(--redpen); background:linear-gradient(transparent 52%, rgba(255,241,118,.95) 52%, rgba(255,241,118,.95) 88%, transparent 88%); padding:0 8px}
  .pop.gold{color:#2E7D32; background:linear-gradient(transparent 52%, rgba(200,230,201,.95) 52%, rgba(200,230,201,.95) 88%, transparent 88%)}
  body.evil .pop{color:#FFF; background:none; text-shadow:0 0 1px #fff; filter:drop-shadow(0 0 1px rgba(255,255,255,.6))}
  .pop.go{animation:popword 1.3s cubic-bezier(.2,1.6,.35,1) both}
  @keyframes popword{0%{opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(-12deg)}15%{opacity:1; transform:translate(-50%,-50%) scale(1.1) rotate(-5deg)}25%{transform:translate(-50%,-50%) scale(1) rotate(-5deg)}80%{opacity:1}100%{opacity:0; transform:translate(-50%,-70%) rotate(-5deg)}}
  .tools{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:8px}
  .btn{appearance:none; cursor:pointer; position:relative; font:21px var(--hand); color:#2B2B2B; background:#fff; border:2.5px solid #2B2B2B; border-radius:var(--wob); box-shadow:3px 3px 0 #2B2B2B; padding:3px 10px 8px; line-height:1.1; display:flex; align-items:center; justify-content:center; gap:6px}
  .btn:nth-child(2n){border-radius:var(--wob2)}
  .btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 #2B2B2B}
  .btn.green, .btn.red, .btn.yellow{background:var(--hl)}
  a.btn{text-decoration:none}
  .btn.more{flex-direction:column; gap:0; line-height:1.05}
  .btn.more small{font-size:15px; opacity:.7}
  .tip a{color:inherit; text-decoration:underline wavy; text-underline-offset:4px}
  .tip.done{color:var(--ink)}
  .btn:disabled{opacity:.4; cursor:default; transform:none}
  .btn svg{width:18px; height:18px}
  body.evil .tools .btn{background:transparent; color:var(--ink); border-color:var(--ink); box-shadow:none}
  .tip{margin:12px 0 0; text-align:center; font:700 21px/1.1 var(--title); color:var(--ink-soft); transform:rotate(-1.5deg)}
  .btn:focus-visible,.doodle-btn:focus-visible,.stage:focus-visible,.arrow:focus-visible{outline:3px dashed var(--pen); outline-offset:3px}
  .overlay{zoom:var(--zoom, 1); position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; background:rgba(40,36,30,.45); padding-inline:16px; padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
  .sheet{position:relative; width:100%; max-width:350px; max-height:100%; overflow:auto; box-sizing:border-box; color:#2B2B2B;
    background:#FFFDF7; background-image:repeating-linear-gradient(#FFFDF7 0 27px, #D6E4F2 27px 28px);
    border:2.5px solid #2B2B2B; border-radius:var(--wob); box-shadow:5px 6px 0 rgba(0,0,0,.2); padding:22px 18px 18px; text-align:center; display:flex; flex-direction:column; gap:10px; transform:rotate(-.8deg); animation:popin .4s cubic-bezier(.2,1.5,.4,1)}
  .sheet.night{background:#2F4A3A; background-image:none; color:#F4F1E8; border:8px solid #8B5E3C; border-radius:6px}
  @keyframes popin{from{transform:scale(.6) rotate(-6deg); opacity:0}}
  .sheet h2{margin:0; font:700 38px/1 var(--title); display:inline-block; align-self:center; padding:0 8px; background:linear-gradient(transparent 55%, var(--yellow) 55%, var(--yellow) 90%, transparent 90%); transform:rotate(-2deg)}
  .sheet h2.green{background:linear-gradient(transparent 55%, var(--green) 55%, var(--green) 90%, transparent 90%)}
  .sheet h2.red{background:linear-gradient(transparent 55%, var(--red) 55%, var(--red) 90%, transparent 90%)}
  .sheet.night h2{background:none; color:#FFE082; text-decoration:underline wavy #FF8A80 2px; text-underline-offset:6px}
  .sheet p{margin:0; font-size:18px; line-height:1.3}
  .sheet .say{font:700 25px/1.1 var(--title); color:var(--redpen)}
  .sheet.night .say{color:#FFE082}
  .hero{align-self:center; width:130px; height:130px}
  .rules{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; text-align:left}
  .rules li{display:flex; gap:10px; align-items:center; font-size:17px; line-height:1.2}
  .rules canvas{flex:none; width:46px; height:46px}
  .note-card{position:relative; background:var(--yellow); color:#2B2B2B; padding:8px 12px; transform:rotate(1.2deg); box-shadow:2px 3px 0 rgba(0,0,0,.15); font-size:17px; line-height:1.25}
  .note-card b{font:700 24px var(--title)}
  .sheet.night .note-card{background:transparent; color:#F4F1E8; border:2px dashed rgba(244,241,232,.6); box-shadow:none}
  .btns{display:flex; flex-direction:column; gap:12px; margin-top:4px}
  .stamp{align-self:center; font:700 40px/1 var(--title); padding:2px 14px; color:#2E7D32; border:3px solid #2E7D32; border-radius:var(--wob); transform:rotate(-8deg); animation:stamp .5s cubic-bezier(.2,1.6,.4,1) .15s both}
  @keyframes stamp{from{transform:scale(3) rotate(10deg); opacity:0}}
  .share{margin:0; text-align:left; background:#fff; color:#2B2B2B; border:2px dashed #9E9A92; padding:10px 12px; font:15px/1.55 ui-monospace,Menlo,monospace; white-space:pre-wrap; user-select:text; -webkit-user-select:text}
  .sheet.night .share{background:rgba(0,0,0,.2); color:#F4F1E8; border-color:rgba(244,241,232,.5)}
  .cast{display:grid; grid-template-columns:1fr 1fr; gap:8px; text-align:left}
  .cast div{display:flex; gap:6px; align-items:center; border-bottom:1.5px dashed #BDB7AC; padding-bottom:4px}
  .cast canvas{width:50px; height:50px; flex:none}
  .cast b{display:block; font:700 22px/1 var(--title)}
  .cast small{display:block; font:15px/1.1 var(--hand); color:#6B6660}
  .cast .wide{grid-column:1 / -1; background:var(--red); padding:4px 6px; border:0; transform:rotate(-1deg)}
  .note{font-size:15px!important; color:#8A847A}
  .sheet.night .note{color:#B9C4B8}
  [hidden]{display:none!important}
  /* wide screens (desktop expanded view): controls on the left, the board takes the whole right side */
  @media (orientation: landscape) and (min-width: 700px){
    /* six auto rows stretch to the board's height, so the left column is spread top to bottom */
    .app{max-width:1180px; display:grid; grid-template-columns:minmax(210px, 240px) minmax(0, 1fr); grid-template-rows:repeat(6, auto); align-content:stretch; column-gap:24px; row-gap:10px}
    .app > *{grid-column:1; align-self:center}
    .board-wrap{grid-column:2; grid-row:1 / -1; align-self:center; margin:0; min-width:0}
    .brand b{font-size:30px; white-space:nowrap}
    .brand small{font-size:16px}
    .doodle-btn{width:34px; height:34px} .doodle-btn svg{width:18px; height:18px}
    .stages{grid-template-columns:1fr; gap:12px}
    .stage.extra{flex-direction:row; justify-content:flex-start; gap:8px; text-align:left}
    .stage.extra span{display:flex; gap:8px; align-items:baseline}
    .stage{padding:9px 12px 10px; font-size:20px}
    .stage canvas{width:34px; height:34px}
    .stage small{font-size:14px}
    .side{font-size:16px} .side b{font-size:34px}
    .count b{font-size:46px} .count span{font-size:19px}
    .tools{gap:8px; margin-top:0}
    .tools .btn{font-size:19px; padding:7px 4px 10px; white-space:nowrap}
    .tip{text-align:left; margin-top:0; font-size:17px; line-height:1.3}
  }

  @media (max-height:700px){ .timer{width:56px; height:50px} .timer b{font-size:28px} .hero{width:100px; height:100px} .sheet h2{font-size:32px} }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; animation-iteration-count:1!important; transition:none!important}}

    </style>
  </head>
  <body>


<div class="app">
  <div class="top">
    <div class="brand"><b>Mochi Meltdown</b><small id="dateLbl">daily puzzle</small></div>
    <div class="spacer"></div>
    <button class="doodle-btn" id="btnSound" type="button" aria-label="Sound"></button>
    <button class="doodle-btn" id="btnCast" type="button" aria-label="How to play">?</button>
  </div>
  <div class="stages" id="stages"></div>
  <div class="rulebar" id="rulebar" hidden></div>
  <div class="hud">
    <div class="side"><span>try</span><b id="tries">1</b></div>
    <div class="count" id="count"><div><b id="moves">3</b><span>swipes left</span></div><div class="ticks" id="ticks"></div></div>
    <div class="side right"><span>undos</span><b id="undoLeft">3</b></div>
  </div>
  <div class="board-wrap" id="boardWrap"><div class="tray" id="tray"><canvas id="board" aria-label="Puzzle board"></canvas><div class="pop" id="pop"></div></div></div>
  <nav class="tools" id="tools">
    <button class="btn" id="btnUndo" type="button">undo</button>
    <button class="btn" id="btnReset" type="button">retry</button>
    <button class="btn" id="btnGiveUp" type="button">give up</button>
  </nav>
  <p class="tip" id="tip"></p>
</div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet"></div></div>


    <script src="game.js" type="module"></script>
  </body>
</html>
